<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f59e0b">
<title>Biashara Rahisi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff8eb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#f59e0b;--pri-d:#b45309;--ok:#16a34a;--err:#dc2626;--line:#eee3cf}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
.wrap{max-width:780px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0000000a}
h1,h2,h3{margin:0 0 8px}h1{font-size:1.5rem}h2{font-size:1.15rem}h3{font-size:1rem}
.mut{color:var(--mut);font-size:.9rem}
input,textarea,select,button{font:inherit;width:100%;padding:11px;border:1px solid #d9cdb4;border-radius:10px;background:#fff}
button{background:var(--ink);color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:8px}
button.pri{background:var(--pri);color:#1f2937}
button.ghost{background:#fff;color:var(--ink);border:1px solid #d9cdb4}
button.danger{background:var(--err)}
button.sm{width:auto;padding:7px 12px;font-size:.85rem;margin:4px 6px 0 0}
button:disabled{opacity:.5}
label{display:block;font-weight:600;margin:10px 0 5px;font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;padding:0;margin:0;border-radius:50%}
.qty b{min-width:20px;text-align:center}
.msg{padding:12px;border-radius:10px;margin-top:10px}
.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#991b1b}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.tabs button{width:auto;margin:0;background:#fff;color:var(--ink);border:1px solid #d9cdb4;white-space:nowrap}
.tabs button.on{background:var(--pri);border-color:var(--pri)}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.78rem;font-weight:700;background:#fde68a;color:#78350f}
.badge.paid{background:#bbf7d0;color:#14532d}.badge.cancelled{background:#fecaca;color:#7f1d1d}.badge.delivered{background:#bbf7d0;color:#14532d}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fffbeb;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.1rem;margin-top:4px}
a{color:var(--pri-d)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top button{width:auto;margin:0}
</style>
</head>
<body>
<main class="wrap" id="app">Inapakia...</main>
<script>
const SB_URL='https://xinxsfxbefsgmzwnhxtb.supabase.co';
const SB_KEY='sb_publishable_IOonvgq8_6zCN6fLgxaLIg_CPdD-FYl';
const sb=supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById('app');
const G=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'TZS '+Number(n||0).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtTime=s=>new Date(s).toLocaleString('sw-TZ',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

/* ================= CUSTOMER SHOP ================= */
async function shop(){
  const slug=new URLSearchParams(location.search).get('b')||'james-chips-point';
  let {data:b}=await sb.from('businesses').select('id,name,phone,location').eq('public_slug',slug).maybeSingle();
  if(!b){const {data:all}=await sb.from('businesses').select('id,name,phone,location').eq('is_active',true).limit(2);if(all&&all.length===1)b=all[0]}
  if(!b){app.innerHTML='<div class="card">Biashara haipatikani.</div>';return}
  document.title=b.name;
  const [pr,pm]=await Promise.all([
    sb.from('business_products').select('id,name,category,price,description,is_customizable').eq('business_id',b.id).eq('is_available',true).order('category').order('name'),
    sb.from('business_payment_methods').select('method_name,account_name,account_number,instructions').eq('business_id',b.id).eq('is_active',true)
  ]);
  const prods=pr.data||[], pays=pm.data||[], cart={};
  app.innerHTML=`
  <div class="card"><h1>${esc(b.name)} 🍟</h1><div class="mut">Chagua unachotaka, tuma oda, tutakupigia kuthibitisha.${b.location?'<br>📍 '+esc(b.location):''}${b.phone?'<br>📞 '+esc(b.phone):''}</div></div>
  <div class="card"><h2>Menu</h2><div id="menu">${prods.map(p=>`
    <div class="row"><div><b>${esc(p.name)}</b><div class="mut">${esc(p.description||p.category||'')}</div>
      ${p.is_customizable?`<input class="cr" data-id="${p.id}" placeholder="Maelezo (mf. bila pilipili)" maxlength="200" style="display:none;margin-top:6px">`:''}</div>
      <div style="text-align:right"><b>${money(p.price)}</b>
      <div class="qty" style="justify-content:flex-end;margin-top:6px"><button type="button" class="ghost" data-q="-1" data-id="${p.id}">−</button><b id="q-${p.id}">0</b><button type="button" class="pri" data-q="1" data-id="${p.id}">+</button></div></div></div>`).join('')||'<div class="mut">Menu haijawekwa.</div>'}</div>
    <div class="row"><b>Jumla</b><b id="total">${money(0)}</b></div></div>
  <div class="card"><h2>Tuma Oda</h2>
    <form id="f"><div class="grid"><div><label>Jina</label><input id="name" required maxlength="100"></div><div><label>Simu</label><input id="phone" type="tel" required maxlength="30"></div></div>
    <label>Mahali pa delivery</label><input id="loc" required maxlength="200">
    <label>Maelezo ya eneo (hiari)</label><input id="desc" maxlength="300" placeholder="Karibu na...">
    <label>Muda unaotaka (hiari)</label><input id="when" type="datetime-local">
    <label>Maelezo mengine (hiari)</label><textarea id="notes" rows="2" maxlength="500"></textarea>
    ${pays.length?`<div class="mut" style="margin-top:10px"><b>Malipo:</b> ${pays.map(m=>esc(m.method_name)+(m.account_number?' '+esc(m.account_number):'')+(m.account_name?' ('+esc(m.account_name)+')':'')+(m.instructions?' — '+esc(m.instructions):'')).join('<br>')}</div>`:''}
    <button class="pri" id="send">📦 Tuma Oda</button></form><div id="msg"></div></div>`;
  const upd=()=>{
    let t=0;prods.forEach(p=>{const q=cart[p.id]||0;t+=q*Number(p.price);document.getElementById('q-'+p.id).textContent=q;
      const cr=document.querySelector(`.cr[data-id="${p.id}"]`);if(cr)cr.style.display=q>0?'block':'none'});
    document.getElementById('total').textContent=money(t)};
  document.getElementById('menu').onclick=e=>{const btn=e.target.closest('button[data-q]');if(!btn)return;
    const id=btn.dataset.id;cart[id]=Math.max(0,Math.min(50,(cart[id]||0)+Number(btn.dataset.q)));upd()};
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();const msg=document.getElementById('msg'),btn=document.getElementById('send');
    const items=Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>({product_id:id,quantity:q,custom_request:document.querySelector(`.cr[data-id="${id}"]`)?.value||null}));
    if(!items.length){msg.innerHTML='<div class="msg err">Chagua angalau bidhaa moja.</div>';return}
    btn.disabled=true;msg.innerHTML='<div class="msg">Inatuma...</div>';
    const w=document.getElementById('when').value;
    const {data,error}=await sb.rpc('place_order',{p_business_id:b.id,p_name:G('name').value,p_phone:G('phone').value,p_location:G('loc').value,p_location_desc:G('desc').value,
      p_requested_at:w?new Date(w).toISOString():null,p_notes:G('notes').value,p_items:items});
    btn.disabled=false;
    if(error){msg.innerHTML=`<div class="msg err">Oda haijatumwa: ${esc(error.message)}</div>`;return}
    msg.innerHTML=`<div class="msg ok">✅ Oda imetumwa. Namba ya oda: <b>${esc(data)}</b>. Tutakupigia kuthibitisha.</div>`;
    Object.keys(cart).forEach(k=>delete cart[k]);upd();e.target.reset();
  };
}

/* ================= OWNER DASHBOARD ================= */
const ST={new:'Mpya',confirmed:'Imethibitishwa',preparing:'Inaandaliwa',ready:'Tayari',out_for_delivery:'Njiani',delivered:'Imefikishwa',cancelled:'Imefutwa'};
const NEXT={new:'confirmed',confirmed:'preparing',preparing:'ready',ready:'out_for_delivery',out_for_delivery:'delivered'};
const NEXTL={new:'Thibitisha',confirmed:'Anza kuandaa',preparing:'Tayari',ready:'Peleka',out_for_delivery:'Imefikishwa'};
let me=null,bizId=null,bizName='',tab='orders',filter='active',range=1,timer=null;

async function admin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){return loginView()}
  me=session.user;
  const {data:mem}=await sb.from('business_members').select('business_id,role').eq('user_id',me.id).limit(1);
  if(!mem||!mem.length){
    app.innerHTML=`<div class="card"><h2>Akaunti haijaunganishwa</h2><p>Mpe msimamizi email hii aiunganishe na biashara: <b>${esc(me.email)}</b></p><button id="out" class="ghost">Toka</button></div>`;
    document.getElementById('out').onclick=async()=>{await sb.auth.signOut();admin()};return}
  bizId=mem[0].business_id;
  const {data:b}=await sb.from('businesses').select('name').eq('id',bizId).maybeSingle();bizName=b?.name||'';
  shell();
}
function loginView(){
  app.innerHTML=`<div class="card"><h1>Dashibodi 🔐</h1><div class="mut">Ingia kusimamia biashara yako.</div>
  <form id="lf"><label>Email</label><input id="em" type="email" required><label>Nenosiri</label><input id="pw" type="password" minlength="6" required>
  <button class="pri" id="in">Ingia</button><button type="button" class="ghost" id="su">Jisajili (akaunti mpya)</button></form><div id="lm"></div></div>`;
  const lm=document.getElementById('lm');
  document.getElementById('lf').onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:G('em').value,password:G('pw').value});
    if(error){lm.innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return}admin()};
  document.getElementById('su').onclick=async()=>{
    if(!G('em').value||G('pw').value.length<6){lm.innerHTML='<div class="msg err">Weka email na nenosiri (angalau herufi 6).</div>';return}
    const {data,error}=await sb.auth.signUp({email:G('em').value,password:G('pw').value});
    if(error){lm.innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return}
    if(data.session){admin()}else lm.innerHTML='<div class="msg ok">Akaunti imeundwa. Angalia email yako kuthibitisha, kisha ingia.</div>'};
}
function shell(){
  app.innerHTML=`<div class="card top"><div><h2>${esc(bizName)}</h2><div class="mut">${esc(me.email)}</div></div><button id="out" class="ghost">Toka</button></div>
  <div class="tabs" id="tabs">${[['orders','Oda'],['summary','Muhtasari'],['costs','Gharama'],['products','Bidhaa']].map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div><div id="view"></div>`;
  document.getElementById('out').onclick=async()=>{await sb.auth.signOut();clearInterval(timer);admin()};
  document.getElementById('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;shell()};
  clearInterval(timer);
  ({orders:ordersView,summary:summaryView,costs:costsView,products:productsView})[tab]();
  if(tab==='orders')timer=setInterval(()=>{if(document.getElementById('olist'))loadOrders()},20000);
}
const V=()=>document.getElementById('view');

/* ---- Orders ---- */
function ordersView(){
  V().innerHTML=`<div class="tabs" id="flt">${[['active','Zinazoendelea'],['new','Mpya'],['delivered','Zilizokamilika'],['cancelled','Zilizofutwa'],['all','Zote']].map(([k,l])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l}</button>`).join('')}</div><div id="olist">Inapakia...</div>`;
  document.getElementById('flt').onclick=e=>{const f=e.target.dataset.f;if(!f)return;filter=f;ordersView()};
  loadOrders();
}
async function loadOrders(){
  let q=sb.from('orders').select('*,order_items(*)').eq('business_id',bizId).order('created_at',{ascending:false}).limit(100);
  if(filter==='active')q=q.in('order_status',['new','confirmed','preparing','ready','out_for_delivery']);
  else if(filter!=='all')q=q.eq('order_status',filter);
  const {data,error}=await q;const el=document.getElementById('olist');if(!el)return;
  if(error){el.innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return}
  el.innerHTML=(data||[]).map(o=>`<div class="card">
    <div class="top"><b>#${esc(o.id.slice(0,8).toUpperCase())}</b><span><span class="badge ${esc(o.order_status)}">${esc(ST[o.order_status]||o.order_status)}</span> <span class="badge ${o.payment_status==='paid'?'paid':''}">${o.payment_status==='paid'?'Imelipwa':'Haijalipwa'}</span></span></div>
    <div class="mut">${fmtTime(o.created_at)}</div>
    <p style="margin:8px 0"><b>${esc(o.customer_name)}</b> · <a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a><br>📍 ${esc(o.location||'-')}${o.location_description?' — '+esc(o.location_description):''}</p>
    ${(o.order_items||[]).map(i=>`<div class="row"><span>${esc(i.quantity)} × ${esc(i.item_name)}${i.custom_request?`<br><small class="mut">${esc(i.custom_request)}</small>`:''}</span><span>${money(i.line_total)}</span></div>`).join('')}
    ${o.notes?`<div class="mut">📝 ${esc(o.notes)}</div>`:''}
    <div class="row"><b>Jumla</b><b>${money(o.total)}</b></div>
    <div>${NEXT[o.order_status]?`<button class="sm pri" data-a="adv" data-id="${o.id}" data-to="${NEXT[o.order_status]}">${NEXTL[o.order_status]}</button>`:''}
    ${o.payment_status!=='paid'&&o.order_status!=='cancelled'?`<button class="sm" data-a="paid" data-id="${o.id}">Imelipwa (cash)</button>`:''}
    ${['new','confirmed','preparing'].includes(o.order_status)?`<button class="sm danger" data-a="cancel" data-id="${o.id}">Futa</button>`:''}</div></div>`).join('')||'<div class="card mut">Hakuna oda hapa.</div>';
}

/* ---- Summary ---- */
function summaryView(){
  V().innerHTML=`<div class="tabs" id="rg">${[[1,'Leo'],[7,'Siku 7'],[30,'Siku 30']].map(([k,l])=>`<button data-r="${k}" class="${range===k?'on':''}">${l}</button>`).join('')}</div><div id="sum">Inapakia...</div>`;
  document.getElementById('rg').onclick=e=>{const r=e.target.dataset.r;if(!r)return;range=Number(r);summaryView()};
  loadSummary();
}
async function loadSummary(){
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(range-1));const iso=d.toISOString(),ds=ymd(d);
  const [o,e,p]=await Promise.all([
    sb.from('orders').select('total,order_status,payment_status').eq('business_id',bizId).gte('created_at',iso).limit(5000),
    sb.from('expenses').select('amount').eq('business_id',bizId).gte('expense_date',ds).limit(5000),
    sb.from('purchases').select('amount').eq('business_id',bizId).gte('purchase_date',ds).limit(5000)]);
  const orders=(o.data||[]).filter(x=>x.order_status!=='cancelled');
  const sum=a=>a.reduce((s,x)=>s+Number(x.total??x.amount??0),0);
  const sales=sum(orders),paid=sum(orders.filter(x=>x.payment_status==='paid')),exp=sum(e.data||[]),pur=sum(p.data||[]);
  const el=document.getElementById('sum');if(!el)return;
  el.innerHTML=`<div class="stats">
   <div class="stat">Oda<b>${orders.length}</b></div><div class="stat">Mauzo yote<b>${money(sales)}</b></div>
   <div class="stat">Yaliyolipwa<b>${money(paid)}</b></div><div class="stat">Gharama + manunuzi<b>${money(exp+pur)}</b></div>
   <div class="stat" style="grid-column:1/-1">Faida (yaliyolipwa − matumizi)<b style="color:${paid-exp-pur>=0?'var(--ok)':'var(--err)'}">${money(paid-exp-pur)}</b></div></div>`;
}

/* ---- Expenses & purchases ---- */
function costsView(){
  const today=ymd(new Date());
  V().innerHTML=`<div class="card"><h3>Ongeza gharama</h3><form id="ef"><label>Maelezo</label><input id="ed" required>
    <div class="grid"><div><label>Kiasi (TZS)</label><input id="ea" type="number" min="0" step="any" required></div><div><label>Aina</label><input id="ec" placeholder="mf. umeme, mafuta"></div></div>
    <label>Tarehe</label><input id="edt" type="date" value="${today}"><button class="pri">Hifadhi gharama</button></form></div>
  <div class="card"><h3>Ongeza manunuzi (stock)</h3><form id="pf"><label>Bidhaa</label><input id="pn" required placeholder="mf. Viazi, Kuku">
    <div class="grid"><div><label>Kiasi / idadi</label><input id="pq" type="number" min="0" step="any"></div><div><label>Gharama (TZS)</label><input id="pa" type="number" min="0" step="any" required></div></div>
    <label>Tarehe</label><input id="pdt" type="date" value="${today}"><button class="pri">Hifadhi manunuzi</button></form></div>
  <div id="clist">Inapakia...</div>`;
  document.getElementById('ef').onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.from('expenses').insert({business_id:bizId,description:G('ed').value,amount:Number(G('ea').value),category:G('ec').value||null,expense_date:G('edt').value||today});
    if(error)return alert(error.message);e.target.reset();G('edt').value=today;loadCosts()};
  document.getElementById('pf').onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.from('purchases').insert({business_id:bizId,item_name:G('pn').value,quantity:G('pq').value?Number(G('pq').value):null,amount:Number(G('pa').value),purchase_date:G('pdt').value||today});
    if(error)return alert(error.message);e.target.reset();G('pdt').value=today;loadCosts()};
  loadCosts();
}
async function loadCosts(){
  const [e,p]=await Promise.all([
    sb.from('expenses').select('*').eq('business_id',bizId).order('expense_date',{ascending:false}).order('created_at',{ascending:false}).limit(20),
    sb.from('purchases').select('*').eq('business_id',bizId).order('purchase_date',{ascending:false}).order('created_at',{ascending:false}).limit(20)]);
  const el=document.getElementById('clist');if(!el)return;
  el.innerHTML=`<div class="card"><h3>Gharama za karibuni</h3>${(e.data||[]).map(x=>`<div class="row"><span>${esc(x.description)}<br><small class="mut">${esc(x.expense_date)}${x.category?' · '+esc(x.category):''}</small></span><span>${money(x.amount)} <button class="sm danger" data-a="delexp" data-id="${x.id}">✕</button></span></div>`).join('')||'<div class="mut">Hakuna.</div>'}</div>
  <div class="card"><h3>Manunuzi ya karibuni</h3>${(p.data||[]).map(x=>`<div class="row"><span>${esc(x.item_name)}${x.quantity!=null?' ('+esc(x.quantity)+')':''}<br><small class="mut">${esc(x.purchase_date)}</small></span><span>${money(x.amount)} <button class="sm danger" data-a="delpur" data-id="${x.id}">✕</button></span></div>`).join('')||'<div class="mut">Hakuna.</div>'}</div>`;
}

/* ---- Products ---- */
function productsView(){
  V().innerHTML=`<div class="card"><h3>Ongeza bidhaa</h3><form id="nf"><div class="grid"><div><label>Jina</label><input id="nn" required></div><div><label>Aina</label><input id="nc" placeholder="mf. Chips, Vinywaji"></div></div>
    <div class="grid"><div><label>Bei (TZS)</label><input id="np" type="number" min="0" step="any" required></div><div><label>Maelezo</label><input id="nd"></div></div>
    <label style="display:flex;gap:8px;align-items:center"><input id="ncu" type="checkbox" style="width:auto"> Mteja anaweza kuandika maelezo (mf. bila pilipili)</label><button class="pri">Ongeza</button></form></div><div id="plist">Inapakia...</div>`;
  document.getElementById('nf').onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.from('business_products').insert({business_id:bizId,name:G('nn').value,category:G('nc').value||null,price:Number(G('np').value),description:G('nd').value||null,is_customizable:G('ncu').checked});
    if(error)return alert(error.message);e.target.reset();loadProducts()};
  loadProducts();
}
async function loadProducts(){
  const {data}=await sb.from('business_products').select('*').eq('business_id',bizId).order('category').order('name');
  const el=document.getElementById('plist');if(!el)return;
  el.innerHTML=`<div class="card">${(data||[]).map(p=>`<div class="row"><span><b>${esc(p.name)}</b><br><small class="mut">${esc(p.category||'')} · ${money(p.price)}</small></span>
    <span><button class="sm ghost" data-a="price" data-id="${p.id}" data-p="${p.price}">Bei</button><button class="sm ${p.is_available?'':'danger'}" data-a="avail" data-id="${p.id}" data-v="${p.is_available}">${p.is_available?'Ipo':'Haipo'}</button></span></div>`).join('')||'<div class="mut">Hakuna bidhaa.</div>'}</div>`;
}

/* ---- Actions ---- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const {a,id}=b.dataset;let r;
  if(a==='adv')r=await sb.from('orders').update({order_status:b.dataset.to}).eq('id',id);
  else if(a==='paid')r=await sb.from('orders').update({payment_status:'paid',payment_method:'Cash'}).eq('id',id);
  else if(a==='cancel'){if(!confirm('Futa oda hii?'))return;r=await sb.from('orders').update({order_status:'cancelled'}).eq('id',id)}
  else if(a==='delexp'){if(!confirm('Futa gharama hii?'))return;r=await sb.from('expenses').delete().eq('id',id)}
  else if(a==='delpur'){if(!confirm('Futa manunuzi haya?'))return;r=await sb.from('purchases').delete().eq('id',id)}
  else if(a==='avail')r=await sb.from('business_products').update({is_available:b.dataset.v!=='true'}).eq('id',id);
  else if(a==='price'){const v=prompt('Bei mpya (TZS):',b.dataset.p);if(v===null||isNaN(Number(v)))return;r=await sb.from('business_products').update({price:Number(v)}).eq('id',id)}
  if(r?.error)return alert(r.error.message);
  ({adv:loadOrders,paid:loadOrders,cancel:loadOrders,delexp:loadCosts,delpur:loadCosts,avail:loadProducts,price:loadProducts})[a]();
});

(location.hash==='#admin'||location.hash==='#dashboard')?admin():shop();
window.addEventListener('hashchange',()=>location.reload());
</script>
